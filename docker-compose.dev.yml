version: '3.9'

# Development override — hot reload, exposed ports, no build needed for app code
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      target: builder          # Use the build stage (has ts-node-dev)
    command: npm run dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./server/src:/app/src:ro
      - ./prisma:/app/prisma:ro
    ports:
      - "4000:4000"

  worker:
    build:
      target: builder
    command: npm run dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./worker/src:/app/src:ro
      - ./prisma:/app/prisma:ro

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_SOCKET_URL: http://localhost:4000
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
